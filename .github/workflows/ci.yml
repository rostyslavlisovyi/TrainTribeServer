name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
        env:
          NODE_ENV: test
      - name: Typecheck
        run: npm run typecheck
        env:
          NODE_ENV: test
      - name: Test
        run: npm run test -- --runInBand
        env:
          NODE_ENV: test
          SERVER_PORT: 4000
          DB_TYPE: mongodb
          DB_NAME: ci
          MONGODB_URI: mongodb://localhost:27017/ci
          FIREBASE_PROJECT_ID: dummy
          FIREBASE_CLIENT_EMAIL: dummy@example.com
          FIREBASE_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\\nDUMMY\\n-----END PRIVATE KEY-----\\n"
          CRON_SECRET: ci-secret
          APP_URL: http://localhost:3000
